# Cấu hình XcodeGen — chạy `xcodegen generate` để tạo IOScanner.xcodeproj
name: IOScanner
options:
  bundleIdPrefix: com.sontm810
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  IOScanner:
    type: application
    platform: iOS
    sources:
      - path: IOScanner
    info:
      path: IOScanner/Info.plist
      properties:
        CFBundleDisplayName: Scan OCR
        CFBundleName: IOScanner
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: vi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Camera — bắt buộc cho VNDocumentCameraViewController
        NSCameraUsageDescription: "Ứng dụng cần quyền camera để quét tài liệu. Mọi xử lý (nhận diện chữ, tạo PDF) diễn ra hoàn toàn trên máy, không gửi lên máy chủ nào."
        # Cho phép người dùng thấy/chép file trong app Files
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sontm810.IOScanner
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        # Bắt buộc cho app sideload (AltServer/Sideloader): debug dylib không load được
        ENABLE_DEBUG_DYLIB: NO

schemes:
  IOScanner:
    build:
      targets:
        IOScanner: all
    run:
      config: Debug
    archive:
      config: Release
