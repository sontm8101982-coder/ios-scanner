name: Build IPA (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  ios-ipa:
    name: IOScanner (IPA cho iPhone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 26.6 (khớp SDK iOS 26)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned — device)
        run: |
          # ENABLE_DEBUG_DYLIB=NO: bắt buộc cho app sideload (Sideloader/AltServer).
          xcodebuild -project IOScanner.xcodeproj -scheme IOScanner \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            build

      - name: Package IPA (Payload/ chuẩn)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/IOScanner.app Payload/
          zip -qr IOScanner-unsigned.ipa Payload
          ls -la IOScanner-unsigned.ipa
          echo "--- Info.plist của app ---"
          plutil -p Payload/IOScanner.app/Info.plist | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOScanner-unsigned
          path: IOScanner-unsigned.ipa
