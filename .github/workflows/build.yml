name: Build IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ios-ipa:
    name: IOScanner IPA (${{ matrix.os }})
    # macOS 14 đã bị GitHub Actions khai tử (02/11/2026) → chỉ còn macos-26 / macos-15 (arm64).
    # Chạy song song 2 image, bản nào build xong trước thì lấy IPA (queue arm64 hay bị dài).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode (bản mới nhất có trên image)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned — device)
        run: |
          # ENABLE_DEBUG_DYLIB=NO: bắt buộc cho app sideload (Sideloader/AltServer).
          xcodebuild -project IOScanner.xcodeproj -scheme IOScanner \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(Swift|concurrency)|BUILD (SUCCEEDED|FAILED)" | tail -60

      - name: Package IPA (Payload/ chuẩn)
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/IOScanner.app Payload/
          zip -qr IOScanner-unsigned.ipa Payload
          ls -la IOScanner-unsigned.ipa
          echo "--- Info.plist của app ---"
          plutil -p Payload/IOScanner.app/Info.plist | head -40

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IOScanner-unsigned-${{ matrix.os }}
          path: IOScanner-unsigned.ipa

      - name: Upload build log (khi fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
